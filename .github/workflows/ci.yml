name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets release.yml re-run this exact job before it tags, so "green" has one definition.
  workflow_call:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the min supported (ty's target). 3.14 is the newest the locked stack
        # has wheels for (torch 2.14 stops at cp314), and uv.lock forks there. 3.13
        # stays so a 3.14-only break reads as one rather than as a general failure.
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      # setup-uv stopped publishing floating major tags at v8 (supply-chain hardening),
      # so this is an exact version and has to be bumped by hand.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # --locked fails if uv.lock is out of sync with pyproject.toml, so a green CI
      # guarantees the committed lockfile actually resolves the declared deps.
      - run: uv sync --locked --group dev

      # ruff never reads .venv and ty targets 3.10 whatever interpreter runs it
      # ([tool.ty.environment]), so the static checks run once, not once per leg.
      - if: matrix.python-version == '3.10'
        run: uv run ruff check .
      - if: matrix.python-version == '3.10'
        run: uv run ruff format --check .
      - if: matrix.python-version == '3.10'
        run: uv run ty check

      # Model tests are skipped without --run-model, so CI downloads no model.
      - run: uv run pytest
