# Streamlit configuration for the openmed-studio app.
# Any local secrets belong in .streamlit/secrets.toml (gitignored), not here.

[browser]
# This app handles clinical text locally; don't send usage telemetry.
gatherUsageStats = false

[client]
# The model runs in-process; never render exception messages/tracebacks in the
# browser (they can contain note text). Full detail still goes to the server console.
showErrorDetails = "none"

# Every key that decides who may open the app's WebSocket (the channel that runs it). The UI
# has NO authentication. Streamlit reads this file (it sits beside streamlit_app.py) after,
# and over, ~/.streamlit/config.toml and the working directory's, so neither can loosen these.
[server]
# Loopback only, like the API's OPENMED_STUDIO_HOST default. Streamlit's own default is
# every interface (dual-stack "::").
address = "127.0.0.1"
# Loopback alone doesn't stop DNS rebinding: a web page whose domain resolves to 127.0.0.1
# is "same-origin" with the app and gets a full session. This refuses the WebSocket for any
# other Host header.
allowedHosts = ["localhost", "127.0.0.1"]
# Streamlit's defaults, pinned because a config elsewhere could otherwise switch them:
# enableCORS = false, or any corsAllowedOrigins entry, lets that origin's web pages open the
# WebSocket, whatever allowedHosts says (their Host is still 127.0.0.1).
enableCORS = true
corsAllowedOrigins = []
#
# Only a flag or env var overrides these; README "Security & notes" item 2 has the recipes.
# An override REPLACES the allowedHosts list, so keep localhost + 127.0.0.1 in it. Name
# several hosts by repeating the flag or space-separating the env var: "a,b" is one bogus
# name that locks everyone out. E.g. behind an authenticating proxy on this machine (keep
# the address; the proxy must forward the original Host):
#   STREAMLIT_SERVER_ALLOWED_HOSTS="studio.example.org localhost 127.0.0.1" uv run streamlit run streamlit_app.py
# Overriding only the address (as a container needs) leaves localhost working but hangs
# every other host name on "Please wait…" (the log says "Rejecting WebSocket connection").
#
# tests/test_streamlit_config.py pins these and the two keys above: a TOML syntax error
# anywhere in this file makes Streamlit log a traceback and start anyway with ALL of it
# dropped, reverting every setting.

# Nord (https://www.nordtheme.com) — arctic, north-bluish palette, dark only.
# A SINGLE [theme] section is deliberate: Streamlit offers the light/dark selector in
# the settings menu only when BOTH [theme.light] and [theme.dark] exist, so one flat
# [theme] locks the app to this one mode. Don't re-add the mode sections unless you
# want the toggle back.
#
# No `font`/`codeFont`: the upstream Nord template loads Inter + JetBrains Mono from
# fonts.googleapis.com, and a clinical-text tool that already sets
# gatherUsageStats = false shouldn't make an outbound CDN call on every page load (it
# would also silently fall back in an air-gapped deploy). The typography *metrics*
# below are font-family-independent, so they still apply to the built-in stack.
[theme]
base = "dark"

# Polar Night backgrounds, Snow Storm text, Frost accents.
primaryColor = "#88c0d0"              # nord8  — buttons, active widgets
backgroundColor = "#2e3440"           # nord0  — main canvas
secondaryBackgroundColor = "#3b4252"  # nord1  — widget/expander surfaces
codeBackgroundColor = "#3b4252"       # nord1
textColor = "#eceff4"                 # nord6
codeTextColor = "#d8dee9"             # nord4
linkColor = "#81a1c1"                 # nord9
borderColor = "#4c566a"               # nord3

# Borders on, small radius — Nord reads crisp rather than soft.
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "4px"
buttonRadius = "4px"
linkUnderline = false

baseFontSize = 14
baseFontWeight = 400
codeFontSize = "0.875rem"
headingFontSizes = ["32px", "24px", "20px", "16px", "14px", "12px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]

# Aurora + Frost, the semantic palette behind st.error/warning/success accents,
# badges, and :red[...]-style markdown. Matches ui_helpers.PALETTE, which tints the
# entity-highlight marks from the same nine Nord accents.
redColor = "#bf616a"      # nord11
orangeColor = "#d08770"   # nord12
yellowColor = "#ebcb8b"   # nord13
greenColor = "#a3be8c"    # nord14
violetColor = "#b48ead"   # nord15
blueColor = "#81a1c1"     # nord9

chartCategoricalColors = ["#88c0d0", "#81a1c1", "#5e81ac", "#a3be8c", "#ebcb8b", "#d08770", "#bf616a"]

# Sidebar sits one Polar Night step lighter than the canvas, so the engine readout
# and Language filter read as a distinct panel.
[theme.sidebar]
backgroundColor = "#3b4252"           # nord1
secondaryBackgroundColor = "#434c5e"  # nord2
codeBackgroundColor = "#434c5e"       # nord2
borderColor = "#4c566a"               # nord3
