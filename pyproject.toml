[project]
name = "openmed-studio"
version = "0.1.0"
description = "OpenMed Studio — a clinical-NLP app over the OpenMed library: PII/PHI de-identification (surrogate and policy-driven anonymization), clinical NER, and zero-shot (GLiNER) extraction."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Clinical NLP framework + the Hugging Face / PyTorch backend used for inference.
    # This is the portable backend that runs everywhere (CPU, CUDA, Apple MPS).
    # >=2.5.0 is a HARD floor, not a preference: the app bakes openmed's registry and enum
    # surface at authoring time and four equality guards fail on anything older —
    # `DeidMethod` includes 2.0's `aadhaar_mask`, `Policy`/`POLICY_MODELS` carry all 20
    # compliance profiles (2.5.0 added `clinical_preserve`; 2.1.0 had 19, 1.9.x shipped 10),
    # `NER_MODELS` bakes the 2.x entity_types, and the `Medical` NER domain is gone because 2.0
    # dropped the 434M ClinicalNER alias it used.
    "openmed[hf]>=2.5.0",
    # The Streamlit app (`streamlit_app.py`) — one of the two delivery surfaces.
    # Needs streamlit>=1.61 for `st.metric(icon=...)` on every KPI card (1.60 and earlier raise
    # TypeError); the `height="stretch"` flex-layout containers the UI uses predate it.
    "streamlit>=1.61",
    # The FastAPI service (`openmed_studio/main.py`) — the second delivery surface, a thin
    # HTTP layer over the same in-process `service.py` seam. Core (not an extra) so every
    # install can run `python -m openmed_studio`; neither pins transformers, so the
    # `gliner`/`hf-latest` lock fork is unaffected (verify with `uv export | grep transformers`).
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # The in-process validation seam (`openmed_studio/validation.py` +
    # `service.py`) imports pydantic directly, so pin it (openmed/fastapi pull it in too).
    "pydantic>=2",
]

[project.optional-dependencies]
# Native Apple Silicon acceleration (M-series Macs). Install with:
#   uv sync --extra mlx
# openmed then auto-detects MLX; pin it with OPENMED_STUDIO_BACKEND=mlx.
# The default model converts on the fly on MLX, cached beside the HF downloads as
# ~/.cache/openmed/OpenMed_OpenMed-PII-SuperClinical-Small-44M-v1/; passing a
# pre-converted `...-mlx` Hub repo id as `model_name` skips that. See README
# "Apple Silicon (MLX)".
mlx = [
    "openmed[mlx]>=2.5.0",
]

# Zero-shot (GLiNER) extraction — the Clinical NER tab's arbitrary-label sibling. Install with:
#   uv sync --extra gliner
# We depend on the bare `gliner` package rather than openmed's `gliner` extra: openmed
# declares `gliner[tokenizers]`, which drags in python-mecab-ko/camel-tools/stanza/spacy
# (136 packages vs 75 at openmed 2.5) for language tokenizers this clinical app never uses.
# openmed's zero-shot path only needs `import gliner` (it lazy-imports it in
# openmed.ner.families).
#
# gliner caps `transformers<5.17.0` (0.2.29; `<5.14.0` in 0.2.28, `<5.7.0` in 0.2.27), but
# the rest of the stack targets the latest transformers. uv builds ONE universal lock, so merely
# declaring this extra would cap transformers at 5.16.x for EVERY install — including CI and
# the PII/NER tabs. The conflict below (against the marker extra `hf-latest`) forks the
# lock instead: default installs + CI stay on the latest transformers, and only
# `uv sync --extra gliner` downgrades. `--extra mlx --extra gliner` still combine.
# The >=0.2.25 floor is what keeps the conflict below genuine: every gliner from 0.2.25 on caps
# transformers below 5.17 (`<5.2.0` in 0.2.25-0.2.26), whereas 0.2.23-0.2.24 are UNCAPPED and
# would co-resolve with `hf-latest` (gliner==0.2.24 + transformers==5.17.0 resolves).
gliner = [
    "gliner>=0.2.25",
]

# A marker extra that exists solely to make the `gliner` conflict below TRUE: every gliner the
# extra above admits caps `transformers<5.17.0` or lower, so an extra requiring `>=5.17`
# genuinely cannot co-resolve with it.
# Declaring the conflict is what makes uv fork the lock (keeping the default resolution on
# the latest transformers). It has no runtime purpose; you never need to install it.
# KEEP THIS FLOOR AT-OR-ABOVE GLINER'S CAP. It has drifted twice: gliner 0.2.28 raised its
# cap from <5.7 to <5.14, silently making the old `>=5.7` floor satisfiable alongside it
# (5.7-5.13), and 0.2.29 raised it to <5.17, doing the same to `>=5.14` (5.14-5.16) — each
# time leaving the declared conflict merely nominal. Re-check `Requires-Dist: transformers`
# on every gliner bump, and keep the `gliner` floor above any uncapped release.
hf-latest = [
    "transformers>=5.17",
]

# This project runs as an application (a Streamlit app), not an importable package,
# so uv installs the dependencies without building a wheel for it.
[tool.uv]
package = false
# Fork the resolution so `--extra gliner` (transformers<5.17) doesn't drag the default
# install off the latest transformers. See the `gliner`/`hf-latest` extras above.
conflicts = [[{ extra = "gliner" }, { extra = "hf-latest" }]]

[dependency-groups]
dev = [
    # httpx2 backs fastapi.testclient.TestClient used in tests/test_api.py. starlette's
    # testclient imports it first (plain httpx still works but emits a deprecation
    # warning) and types TestClient against it alone, so without it ty sees every client
    # call as Unknown. The floor is starlette's own (`httpx2>=2.0.0` in its `full`
    # extra). Plain httpx stays in uv.lock regardless: huggingface-hub depends on it.
    "httpx2>=2.0.0",
    "pytest>=9.1.0",
    "ruff>=0.15.17",
    "ty>=0.0.49",
]

[tool.ruff.lint]
# pyflakes (F), the recommended pycodestyle error subset (E4/E7/E9), import
# sorting (I), and pyupgrade (UP). Line length (E501) is left to `ruff format`.
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ty.environment]
# Type-check against the minimum supported Python so the code stays portable
# (third-party types are still resolved from the project's .venv).
python-version = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
# This is a uv non-package project, so put the repo root on sys.path for tests to
# import the local `openmed_studio` package (Streamlit does the same via the app's CWD).
pythonpath = ["."]
# -ra shows reasons for skips/xfails; strict flags turn marker/config typos into errors.
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "model: requires loading the OpenMed PII model (slow; downloads on first run). Enabled with --run-model.",
]
